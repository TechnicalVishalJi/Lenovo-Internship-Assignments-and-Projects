<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Digital Clock</title>
    <!-- Modern typography from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clock-container">
        <div class="clock" id="clock">
            <span class="time" id="hours">00</span>
            <span class="colon">:</span>
            <span class="time" id="minutes">00</span>
            <span class="colon">:</span>
            <span class="time" id="seconds">00</span>
            <span class="am-pm" id="ampm">AM</span>
        </div>
        <div class="date" id="date">Loading date...</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
